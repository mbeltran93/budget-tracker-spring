<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--/* Fragmento con los <link>/<meta> comunes a toda pagina. */-->
    <th:block th:fragment="head-common">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
        <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    </th:block>
</head>
<body>
    <!--/* Barra de navegacion, solo visible para usuarios logueados (dashboard/categorias). */-->
    <nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">Budget Tracker</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/categories}">Categorias</a>
            </div>
            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <span class="navbar-text text-light me-3" sec:authentication="name">usuario</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                </form>
            </div>
        </div>
    </nav>

    <!--/* Scripts comunes: jQuery, Bootstrap bundle, Chart.js y el setup global de CSRF para $.ajax. */-->
    <th:block th:fragment="scripts-common">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
        <script th:src="@{/js/csrf-setup.js}"></script>
    </th:block>
</body>
</html>
