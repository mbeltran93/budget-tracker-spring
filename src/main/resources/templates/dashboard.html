<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Budget Tracker - Dashboard</title>
    <th:block th:replace="~{fragments/common :: head-common}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/common :: navbar}"></th:block>

<div class="container">

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-body">
                    <h6 class="text-muted">Gasto total del mes</h6>
                    <h2 id="totalThisMonth" class="mb-0"
                        th:text="${'$' + #numbers.formatDecimal(totalThisMonth, 1, 'COMMA', 2, 'POINT')}">$0.00</h2>
                </div>
            </div>
        </div>
        <div class="col-md-8 d-flex align-items-center justify-content-end">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal"
                    id="btnAddExpense">
                + Agregar gasto
            </button>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <h6 class="text-muted mb-3">Gasto por categoria (mes actual)</h6>
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <h6 class="text-muted mb-3">Presupuesto por categoria</h6>
                    <div id="budgetProgressList">
                        <div class="mb-3" th:each="item : ${budgetOverview}" th:attr="data-category-id=${item.categoryId}">
                            <div class="d-flex justify-content-between">
                                <span th:text="${item.categoryName}">Categoria</span>
                                <span class="budget-amounts">
                                    <span th:text="${'$' + #numbers.formatDecimal(item.spent, 1, 'COMMA', 2, 'POINT')}">$0</span>
                                    /
                                    <span th:text="${'$' + #numbers.formatDecimal(item.monthlyLimit, 1, 'COMMA', 2, 'POINT')}">$0</span>
                                </span>
                            </div>
                            <div class="progress">
                                <div class="progress-bar budget-progress-bar"
                                     th:classappend="'bg-' + ${item.status.bootstrapClass}"
                                     th:style="'width: ' + ${item.percentUsed} + '%'"
                                     th:text="${item.percentUsed} + '%'">0%</div>
                            </div>
                        </div>
                        <p th:if="${#lists.isEmpty(budgetOverview)}" class="text-muted">
                            Todavia no hay categorias. <a th:href="@{/categories/new}">Crea una</a>.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card stat-card">
        <div class="card-body">
            <h6 class="text-muted mb-3">Gastos recientes</h6>
            <table class="table table-hover align-middle" id="expensesTable">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Categoria</th>
                    <th>Descripcion</th>
                    <th class="text-end">Monto</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="expense : ${recentExpenses}"
                    th:id="'expense-row-' + ${expense.id}"
                    th:attr="data-id=${expense.id},
                              data-category-id=${expense.categoryId},
                              data-amount=${expense.amount},
                              data-description=${expense.description},
                              data-date=${expense.date}">
                    <td th:text="${expense.date}">2026-01-01</td>
                    <td th:text="${expense.categoryName}">Categoria</td>
                    <td th:text="${expense.description}">Descripcion</td>
                    <td class="text-end expense-amount"
                        th:text="${'$' + #numbers.formatDecimal(expense.amount, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-secondary btn-edit-expense">Editar</button>
                        <button type="button" class="btn btn-sm btn-outline-danger btn-delete-expense">Borrar</button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p id="noExpensesMessage" class="text-muted" th:if="${#lists.isEmpty(recentExpenses)}">
                Todavia no registraste gastos.
            </p>
        </div>
    </div>
</div>

<!-- Modal de alta/edicion de gasto, manejado 100% por AJAX (jQuery) -->
<div class="modal fade" id="expenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="expenseForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="expenseModalTitle">Nuevo gasto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="expenseId" name="id"/>
                    <div class="alert alert-danger d-none" id="expenseFormError"></div>

                    <div class="mb-3">
                        <label for="expenseCategory" class="form-label">Categoria</label>
                        <select class="form-select" id="expenseCategory" name="categoryId" required>
                            <option value="">Seleccionar...</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"></option>
                        </select>
                        <div class="invalid-feedback" id="errorCategoryId"></div>
                    </div>
                    <div class="mb-3">
                        <label for="expenseAmount" class="form-label">Monto</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" id="expenseAmount"
                               name="amount" required/>
                        <div class="invalid-feedback" id="errorAmount"></div>
                    </div>
                    <div class="mb-3">
                        <label for="expenseDescription" class="form-label">Descripcion</label>
                        <input type="text" maxlength="255" class="form-control" id="expenseDescription"
                               name="description"/>
                        <div class="invalid-feedback" id="errorDescription"></div>
                    </div>
                    <div class="mb-3">
                        <label for="expenseDate" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="expenseDate" name="date" required/>
                        <div class="invalid-feedback" id="errorDate"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveExpense">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Datos iniciales que Thymeleaf ya calculo en el servidor, para pintar el grafico sin otro round-trip -->
<script id="initialBudgetOverview" type="application/json" th:utext="${budgetOverviewJson}"></script>

<th:block th:replace="~{fragments/common :: scripts-common}"></th:block>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
