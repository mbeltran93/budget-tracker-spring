spring:
  application:
    name: budget-tracker-spring

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budget_tracker}
    username: ${DB_USERNAME:budget_user}
    password: ${DB_PASSWORD:budget_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.mbeltran.budgettracker: INFO
