spring:
  application:
    name: budget-tracker-spring

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budget_tracker}
    username: ${DB_USERNAME:budget_user}
    password: ${DB_PASSWORD:budget_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.mbeltran.budgettracker: INFO

app:
  jwt:
    # Secreto de desarrollo: es un repo de portafolio, por eso va commiteado con un
    # default. En produccion esto DEBE sobreescribirse con la variable de entorno JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-change-me-budget-tracker-jwt-secret-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  oauth:
    # Credenciales de las apps OAuth (web). Sin valor, el login social
    # simplemente queda deshabilitado (no se registra el client) en vez de
    # romper el arranque de la app.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
    # Client ID de la app movil (Android/iOS), distinto del client-id web de arriba.
    # Se usa para validar el audience del id_token que manda el SDK google_sign_in.
    google-mobile-client-id: ${GOOGLE_MOBILE_CLIENT_ID:}
