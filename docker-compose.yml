services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budget_tracker
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: budget_pass
    volumes:
      - budget-tracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_user -d budget_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/budget_tracker
      DB_USERNAME: budget_user
      DB_PASSWORD: budget_pass
    ports:
      - "8080:8080"

volumes:
  budget-tracker-db-data:
